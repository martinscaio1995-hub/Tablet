<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Painel do canal{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c;
    --card: #1c1f28;
    --border: #2c303c;
    --text: #e7e9ee;
    --muted: #9aa0ad;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #f2c14e;
    --bad: #f2555a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 3rem;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
  nav a:hover, nav a.active { color: var(--accent); }
  main { max-width: 720px; margin: 0 auto; padding: 1.25rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .card h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
  .muted { color: var(--muted); font-size: 0.88rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; border: 1px solid var(--border);
  }
  .badge.good { color: var(--good); border-color: var(--good); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .badge.neutral { color: var(--muted); }
  a.btn, button {
    display: inline-block; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: 0.55rem 0.9rem;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  button.secondary, a.btn.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  form { margin: 0; }
  input, textarea, select {
    width: 100%; background: #0f1116; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 0.55rem 0.7rem;
    font-size: 0.95rem; margin-bottom: 0.6rem; font-family: inherit;
  }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  .flash { padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: #3a1c1e; color: #ff9a9d; }
  .flash.ok { background: #16311f; color: #7ee2a8; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
</style>
</head>
<body>
<header>
  <a href="/">📋 Painel do canal</a>
  <nav>
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Início</a>
    <a href="/sales" class="{{ 'active' if active == 'sales' else '' }}">Vendas</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
